spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.application.name=backend
server.port=8080

# Database connection (the Docker PostgreSQL, exposed on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/securewallet
spring.datasource.username=wallet_admin
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate create/update tables from our Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

securewallet.n8n.webhook-secret=${N8N_WEBHOOK_SECRET}

securewallet.n8n.login-guard-url=http://localhost:5678/webhook/login-guard
securewallet.n8n.fraud-check-url=http://localhost:5678/webhook/fraud-check